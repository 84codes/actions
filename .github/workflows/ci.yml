name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  site-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck site-preview/apply-redirects.sh
      - run: python3 site-preview/test_apply_redirects.py

  ruby-ci:
    uses: ./.github/workflows/ruby-ci.yml
    with:
      run: |
        rake
        uptime
      ruby-version: ruby # latest stable release
      ruby-lint: true
    secrets:
      github-token: ${{ secrets.ORG_GITHUB_TOKEN_FOR_CI }}
