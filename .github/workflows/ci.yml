name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  site-preview:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/site-preview/Gemfile
      BUNDLE_FROZEN: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - name: Test site preview deployment
        run: bundle exec ruby -Isite-preview/test -e 'Dir["site-preview/test/**/*_test.rb"].sort.each { |path| require_relative path }'

  ruby-ci:
    uses: ./.github/workflows/ruby-ci.yml
    with:
      run: |
        rake
        uptime
      ruby-version: ruby # latest stable release
      ruby-lint: true
    secrets:
      github-token: ${{ secrets.ORG_GITHUB_TOKEN_FOR_CI }}
