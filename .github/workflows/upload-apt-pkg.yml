name: Upload .deb package to S3

on:
  workflow_call:
    inputs:
      package-name:
        description: "Name of the package to upload"
        required: true
        type: string
      arch:
        description: "Arch to upload package for"
        required: true
        type: string
      file:
        description: "File name to upload to S3"
        required: true
        type: string
      codename:
        description: "Codename for the APT repository (e.g., 'any')"
        required: false
        type: string
        default: "any"
      bucket-name:
        description: "Name of the S3 bucket to upload to"
        required: false
        type: string
        default: "apt-repos"
      s3-region:
        description: "AWS S3 region to upload to"
        required: false
        default: "us-east-1"
        type: string
      aws-role-arn:
        description: "AWS IAM Role ARN for OIDC authentication"
        required: true
        type: string
      cloudfront-distribution-id:
        description: "CloudFront distribution ID to invalidate (optional)"
        required: false
        type: string
    secrets:
      gpg_private_key:
        description: "GPG private key for signing releases"
        required: true
      gpg_passphrase:
        description: "Passphrase for the GPG private key"
        required: true

jobs:
  upload-to-s3:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.s3-region }}
      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.file }}
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install deb-s3 gem
        run: gem install deb-s3 -v 24.6.0

      - name: Create GPG Home and Import Key
        run: |
          # Create a temporary GPG home directory
          mkdir -p "${{ runner.temp }}/.gnupg"
          chmod 700 "${{ runner.temp }}/.gnupg"

          # Enable loopback pinentry mode for non-interactive passphrase entry
          echo "allow-loopback-pinentry" >> "${{ runner.temp }}/.gnupg/gpg-agent.conf"

          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import --passphrase "${{ secrets.GPG_PASSPHRASE }}"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GNUPGHOME: ${{ runner.temp }}/.gnupg

      - name: Upload .deb package to S3
        run: |
          GPG_KEY_ID=$(gpg --with-colons --fingerprint --batch | awk -F: '/^fpr:/ { print $10; exit }')
          deb-s3 upload \
            --bucket ${{ inputs.bucket-name }} \
            --s3-region ${{ inputs.s3-region }} \
            --codename ${{ inputs.codename }} \
            --component main \
            --preserve-versions \
            --arch ${{ inputs.arch }} \
            --sign $GPG_KEY_ID \
            --visibility=nil \
            --prefix ${{ inputs.package-name }}/ \
            --gpg-options="--pinentry-mode loopback --passphrase '${{ secrets.GPG_PASSPHRASE }}'" \
            ${{ inputs.file }}
        env:
          GNUPGHOME: ${{ runner.temp }}/.gnupg

      - name: Prune old otel-collector versions
        run: |
          PACKAGE=$(dpkg-deb --field ${{ inputs.file }} Package)
          if [ "$PACKAGE" != "otel-collector" ]; then
            echo "Keeping all versions of $PACKAGE"
            exit 0
          fi
          GPG_KEY_ID=$(gpg --with-colons --fingerprint --batch | awk -F: '/^fpr:/ { print $10; exit }')
          REPO_OPTS=(
            --bucket ${{ inputs.bucket-name }}
            --s3-region ${{ inputs.s3-region }}
            --codename ${{ inputs.codename }}
            --component main
            --prefix ${{ inputs.package-name }}/
          )
          OLD_VERSIONS=$(deb-s3 list "${REPO_OPTS[@]}" --arch ${{ inputs.arch }} \
            | awk -v pkg="$PACKAGE" '$1 == pkg { print $2 }' \
            | sort -V | head -n -$KEEP_VERSIONS)
          if [ -z "$OLD_VERSIONS" ]; then
            echo "No versions of $PACKAGE to prune"
            exit 0
          fi
          deb-s3 delete "$PACKAGE" "${REPO_OPTS[@]}" \
            --arch ${{ inputs.arch }} \
            --versions $OLD_VERSIONS \
            --sign $GPG_KEY_ID \
            --visibility=nil \
            --gpg-options="--pinentry-mode loopback --passphrase '${{ secrets.GPG_PASSPHRASE }}'"
          deb-s3 clean "${REPO_OPTS[@]}"
        env:
          KEEP_VERSIONS: 10
          GNUPGHOME: ${{ runner.temp }}/.gnupg

      - name: Invalidate CloudFront Cache
        if: inputs.cloudfront-distribution-id != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ inputs.cloudfront-distribution-id }} \
            --paths "/*"
